<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
        }
        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Verificación requerida</h2>
        <p>Por favor, completa el CAPTCHA para ver la información.</p>
        
        <!-- Aquí está tu clave de sitio agregada -->
        <div class="g-recaptcha" 
             data-sitekey="6LeKcm0tAAAAABPZ0JDf4agNtjf9K1mQFel6x11C" 
             data-callback="redireccionarAlExito">
        </div>
    </div>

    <script>
        function redireccionarAlExito() {
            // Lee el enlace para saber a qué página enviar al usuario
            const parametrosURL = new URLSearchParams(window.location.search);
            const paginaDestino = parametrosURL.get('destino');
            
            if (paginaDestino) {
                window.location.href = paginaDestino;
            } else {
                document.body.innerHTML = "<h3>Error: No se especificó a dónde ir.</h3>";
            }
        }
    </script>

</body>
</html>
